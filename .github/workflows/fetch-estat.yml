name: Fetch e-Stat School Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Fetch e-Stat data
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          python scripts/fetch_estat_school_data.py

      - name: Check generated files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          find . -maxdepth 3 -type f
          echo "Data directory:"
          ls -la data || true

      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git status
          git commit -m "Update e-Stat school data" || echo "No changes to commit"
          git push
